  <script>
  (async function boot() {
    // Mount router
    window.DMTHRouter.mount(document.getElementById('app'));

    // Load saved state
    const loaded = await window.DMTHGame.state.load();
    if (!loaded || !loaded.createdAt) {
      location.hash = '#newgame';
    } else if (!location.hash) {
      location.hash = '#dashboard';
    }

    // Chrome money + satisfaction sync
    function syncChrome() {
      const s = window.DMTHGame.state.current;
      document.getElementById('chrome-money').textContent = s ? `$${s.wallet.money.toLocaleString()}` : '$0';
      const satEl = document.getElementById('chrome-satisfaction');
      if (satEl && s) {
        const sat = typeof s.wallet.playerSatisfaction === 'number' ? s.wallet.playerSatisfaction : 50;
        const emoji = sat >= 80 ? '😈' : sat >= 60 ? '😏' : sat >= 40 ? '😐' : sat >= 20 ? '😒' : '🥶';
        satEl.textContent = `${emoji} ${Math.round(sat)}`;
      }
      const buzzEl = document.getElementById('chrome-buzz');
      if (buzzEl && s) {
        const buzz = typeof s.wallet.buzz === 'number' ? s.wallet.buzz : 0;
        buzzEl.textContent = `🐝 ${Math.round(buzz)}`;
      }
      const wEl = document.getElementById('chrome-wanted');
      if (wEl && s && window.DMTHGame.wanted) {
        const w = window.DMTHGame.wanted.describe();
        wEl.textContent = `${w.emoji} ${w.label} ${w.level}`;
      }
    }
    syncChrome();
    window.DMTHGame.state.onChange(syncChrome);

    // Gate the game-world chrome: it only shows once a character's been created (state.createdAt)
    // AND we're not sitting on the #newgame creator. Until then the header is bare — no money,
    // no nav, no clock leaking the game world before the game has actually begun. CSS does the
    // hiding via body.game-active; this just decides when the class is on.
    function updateChromeMode() {
      const s = window.DMTHGame.state.current;
      const route = (location.hash || '').replace(/^#/, '').split('?')[0];
      const started = !!(s && s.createdAt) && route !== 'newgame';
      document.body.classList.toggle('game-active', started);
    }
    updateChromeMode();
    window.addEventListener('hashchange', updateChromeMode);
    window.DMTHGame.state.onChange(updateChromeMode);

    // Running game clock display. 1 real second = 1 game minute, so
    // updating the display once a real second is enough to capture every
    // game-minute boundary. The gameClock module is the source of truth.
    const clockEl = document.getElementById('chrome-clock');
    if (clockEl && window.DMTHGame.gameClock) {
      const updateClock = () => { clockEl.textContent = window.DMTHGame.gameClock.formatNow(); };
      updateClock();
      setInterval(updateClock, 1000);
    }

    // Chrome "New Game" button — wipes save + routes to new-game setup. Stops the tick
    // and flags state for nuke before wipeAll() so a racing background save() can't
    // repopulate the save store with old state between the wipe and the reload.
    document.getElementById('chrome-new-game').onclick = async () => {
      if (!confirm('Start a new game? This WIPES your current save. Use Settings → Save Slots first if you want to keep a copy.')) return;
      try { if (window.DMTHGame.tick) window.DMTHGame.tick.stop(); } catch {}
      try { if (window.DMTHVoiceQueue) window.DMTHVoiceQueue.cancel(); } catch {}
      try { window.DMTHGame.state._nuking = true; } catch {}
      await window.DMTHStorage.wipeAll();
      for (const k of Object.keys(localStorage)) if (k.startsWith('dmth_') && k !== 'dmth_pollinations_key' && k !== 'dmth_ollama_endpoint' && k !== 'dmth_ollama_model' && k !== 'dmth_kokoro_voice') localStorage.removeItem(k);
      location.hash = '#newgame';
      location.reload();
    };

    // First route handle
    window.DMTHRouter.handle();

    // Balancing tweak after load
    if (window.DMTHGame.balancing) window.DMTHGame.balancing.applyBalancing();

    // Start the tick engine
    window.DMTHGame.tick.start();

    // === PAUSE.1 — pause/resume + persist across navigation ===
    // Freezes the game clock + gates the tick (no escapes / decay / johns / raids while paused).
    // Paused state persists in localStorage so it restores on reload; every toggle flushes a save.
    const PAUSE_KEY = 'dmth_paused';
    function applyPaused(on, silent) {
      const btn = document.getElementById('chrome-pause');
      if (on) {
        if (window.DMTHGame.gameClock) window.DMTHGame.gameClock.pause();
        if (btn) { btn.textContent = '▶️'; btn.title = 'Paused — click to resume'; btn.classList.add('btn-danger'); }
      } else {
        if (window.DMTHGame.gameClock) window.DMTHGame.gameClock.resume();
        if (btn) { btn.textContent = '⏸'; btn.title = 'Pause the game'; btn.classList.remove('btn-danger'); }
      }
      localStorage.setItem(PAUSE_KEY, on ? '1' : '0');
      try { window.DMTHGame.state.save(); } catch {}
      if (!silent && window.DMTHNotify) window.DMTHNotify.show(on ? '⏸ Game paused — time frozen, progress saved.' : '▶️ Game resumed.', { type: 'info', durationMs: 2000 });
    }
    // Restore last session's pause state (silently — no toast on boot).
    if (localStorage.getItem(PAUSE_KEY) === '1') applyPaused(true, true);
    const pauseBtn = document.getElementById('chrome-pause');
    if (pauseBtn) pauseBtn.onclick = () => applyPaused(localStorage.getItem(PAUSE_KEY) !== '1');

    // Flush a save when navigating away / hiding the tab, so returning to the program reloads
    // the latest progress (mutate() already auto-saves continuously; this is the on-exit flush).
    window.addEventListener('visibilitychange', () => { if (document.hidden) { try { window.DMTHGame.state.save(); } catch {} } });
    window.addEventListener('beforeunload', () => { try { window.DMTHGame.state.save(); } catch {} });

    // === Voice (Kokoro TTS) ===
    // Voice toggle — persists in localStorage. Default: on.
    const VOICE_KEY = 'dmth_voice_on';
    function voiceOn() { return localStorage.getItem(VOICE_KEY) !== 'off'; }
    function setVoice(on) {
      localStorage.setItem(VOICE_KEY, on ? 'on' : 'off');
      const btn = document.getElementById('chrome-voice');
      btn.textContent = on ? '🔊' : '🔇';
      btn.title = on ? 'Voice ON — click to mute' : 'Voice OFF — click to enable';
      // Going OFF mid-response should stop whatever's playing immediately,
      // not let the queue finish + then stop.
      if (!on && window.DMTHVoiceQueue) window.DMTHVoiceQueue.cancel();
    }
    setVoice(voiceOn());
    document.getElementById('chrome-voice').onclick = () => setVoice(!voiceOn());
    window.DMTHIsVoiceOn = voiceOn;   // global so room.js can check before speaking

    // Click the money chip to open The Blood Ledger (its own tab — full categorized books).
    { const mEl = document.getElementById('chrome-money'); if (mEl) mEl.onclick = () => { location.hash = '#ledger'; }; }

    // Auto-check Ollama health on game boot — if the active model's weights
    // were nuked since landing (Storage Sense, manual cleanup, partial pull),
    // surface the repair overlay immediately instead of waiting for the first
    // chat call to fail with a cryptic error.  Non-blocking — fires alongside
    // Kokoro load.  Silent when everything is healthy.
    (async () => {
      try {
        if (window.DMTHOllamaRepairOverlay) {
          // Small delay so the boot UI renders first
          await new Promise(r => setTimeout(r, 800));
          await window.DMTHOllamaRepairOverlay.autoCheck();
        }
      } catch (err) {
        console.debug('[ollama-autocheck] failed silently:', err);
      }
    })();

    // Auto-load Kokoro in the background on game boot.  Model weights are cached
    // in browser IDB after the first landing-page load — re-instantiation here is
    // fast.  Non-blocking — game keeps loading.
    (async () => {
      const btn = document.getElementById('chrome-voice');
      if (!window.DMTHKokoro) return;
      if (window.DMTHKokoro.isReady()) return;
      if (!voiceOn()) return;
      btn.textContent = '⏳';
      btn.title = 'Loading Kokoro voice model…';
      try {
        await window.DMTHKokoro.ensureLoaded((p) => {
          const pct = Math.round((p?.progress || 0) * 100);
          btn.title = `Loading voice ${pct}%…`;
        });
        setVoice(true);
        if (window.DMTHNotify) window.DMTHNotify.show('🔊 Kokoro voice ready', { type: 'success', durationMs: 2000 });
      } catch (err) {
        btn.textContent = '🔇';
        btn.title = 'Kokoro failed to load: ' + err.message;
        if (window.DMTHNotify) window.DMTHNotify.show('🔇 Voice unavailable: ' + err.message, { type: 'error' });
      }
    })();
  })();
  </script>
