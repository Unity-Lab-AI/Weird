# DUNGEON MASTER: THE HUNT — static site deploy to https://weird.git.unityailab.com
#
# Uses the lab's current pages mechanism: the runner (isolated rootless networking) reaches the origin through
# the container gateway, packs the static site into a tarball, and queues it with the Forgejo deploy endpoint,
# which swaps it into the pages web root atomically. The old SSH rsync route no longer reaches the host.
#
# The repo is pure static (vanilla HTML/JS/CSS, no build), so the artifact is the repo root minus VCS/CI, the
# internal workflow docs (docs/, resume.md) and the desktop installer source (app/). README.md and
# SETUP-README.md DO ship: the landing page loads them at runtime through doc.html.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Reach the origin from isolated rootless networking
        run: |
          set -eu
          gateway=$(getent ahostsv4 host.containers.internal | awk 'NR==1 {print $1}')
          test -n "$gateway"
          printf '%s git.unityailab.com weird.git.unityailab.com\n' "$gateway" >> /etc/hosts

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack the static site
        run: |
          set -eu
          test -f index.html
          tar -czf /tmp/artifact.tar.gz \
            --exclude='./.git' --exclude='./.forgejo' --exclude='./.gitea' --exclude='./.github' \
            --exclude='./docs' --exclude='./resume.md' --exclude='./app' --exclude='./dist' \
            -C . .
          # grep reads the whole listing (no -q): an early exit would SIGPIPE tar and fail under pipefail
          tar -tzf /tmp/artifact.tar.gz | grep -x './index.html' > /dev/null

      - name: Queue the artifact for atomic deployment
        env:
          DEPLOY_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -eu
          digest=$(sha256sum /tmp/artifact.tar.gz | cut -d' ' -f1)
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "X-Commit-SHA: $COMMIT" -H "X-Workflow-Run: $WORKFLOW_RUN" \
            -H "X-Repository: UnityAILab/Weird" -H "X-Artifact-SHA256: $digest" \
            --data-binary @/tmp/artifact.tar.gz https://git.unityailab.com/_deploy/repos/174/deploy
